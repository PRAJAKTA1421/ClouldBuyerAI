<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assign Task — Kill Switch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="dashboard-body task-form-body">
    <div class="dashboard-layout">
      <aside class="dashboard-sidebar">
        <a class="dashboard-brand" href="/">
          <span class="brand-shield">K</span>
          <span>KILL SWITCH</span>
        </a>
        <nav class="dashboard-nav">
          <a href="/dashboard">
            <i>⌂</i>
            Dashboard
          </a>
          <a href="/agents">
            <i>♙</i>
            AI Agents
          </a>
          <a class="active" href="/tasks">
            <i>□</i>
            Tasks
          </a>
          <a href="#">
            <i>▣</i>
            Wallets
          </a>
          <a href="#">
            <i>⇄</i>
            Transactions
          </a>
          <a href="#">
            <i>⌾</i>
            Security Policies
          </a>
          <a href="#">
            <i>◌</i>
            Monitoring
          </a>
          <a href="#">
            <i>♧</i>
            Alerts
          </a>
          <a href="#">
            <i>▤</i>
            Reports
          </a>
          <a href="#">
            <i>⚙</i>
            Settings
          </a>
        </nav>
      </aside>
      <main class="dashboard-main">
        <header class="dashboard-topbar">
          <button class="menu-button" type="button">☰</button>
          <div class="topbar-actions">
            <button class="notification-button" type="button">
              ♧
              <b>
              </b>
            </button>
            <div class="account-avatar">P</div>
            <div>
              <strong>Prajakta Patil</strong>
              <small>Owner</small>
            </div>
          </div>
        </header>
        <section class="assign-content">
          <div class="task-form-page">
            <a class="back-link" href="/tasks">
              ←
              <span>Back to tasks</span>
            </a>
            <section class="task-form-card">
              <p class="eyebrow">
                <span>
                </span>
                Protected mission
              </p>
              <h1>
                Assign New Task to
                <span data-agent-name>AI Agent</span>
              </h1>
              <p>What should your agent do?</p>
              <form class="task-form" data-task-form>
                <label>
                  Task / Goal
                  <input type="text" placeholder="Describe the task for your agent" required>
                </label>
                <div class="task-form-row">
                  <label>
                    Budget
                    <input type="number" min="1" placeholder="Enter budget" required>
                  </label>
                  <label>
                    Priority
                    <select required>
                      <option value="" selected disabled>Select priority</option>
                      <option>High</option>
                      <option>Medium</option>
                      <option>Low</option>
                    </select>
                  </label>
                </div>
                <label>
                  Deadline
                  <input type="datetime-local" required>
                </label>
                <label>
                  Instructions
                  <small>(Optional)</small>
                  <textarea placeholder="Add any conditions, preferences, or safety instructions">
                  </textarea>
                </label>
                <div class="agent-actions">
                  <a href="/tasks" class="cancel-agent">Cancel</a>
                  <button type="submit">
                    Start Mission
                    <span>→</span>
                  </button>
                </div>
              </form>
            </section>
          </div>
        </section>
      </main>
    </div>
    <div class="toast">Mission started successfully.</div>
    <script src="{{ url_for('static', filename='script.js') }}">
    </script>
  </body>
</html>
